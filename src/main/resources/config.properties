# Tüm ortamlar için varsayılanlar. Sıra: config.properties → config-{env}.properties → -Dkey=value
# Ortam profili: mvn test -Denv=ci   (local | ci | grid, varsayılan local)
baseUrl=https://www.saucedemo.com/
browser=chrome
headless=false
explicitWaitSeconds=10
pageLoadTimeoutSeconds=30
# Başarısız bir test kaç kez tekrar denensin? 0 = hiç (-DretryCount=0)
retryCount=1
# Boş = tarayıcı yerelde açılır. Dolu = Selenium Grid adresi (ör. http://localhost:4444)
gridUrl=
